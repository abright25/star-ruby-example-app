name: Bright

on:
  pull_request:
    branches:
      - '**'

permissions:
  checks: write
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start application
        env:
          DATABASE_HOST: db
          DATABASE_PASSWORD: password
          DATABASE_USER: blog
          POSTGRES_HOST: db
          POSTGRES_PASSWORD: password
          POSTGRES_USER: blog
          RAILS_ENV: development
        run: |
          docker compose up --wait

      - name: Wait for application readiness
        run: |
          for i in {1..30}; do curl -sS -o /dev/null http://127.0.0.1:3011 && exit 0 || sleep 5; done; exit 1

      - name: Install SecTesterJS dependencies
        run: |
          npm i --save=false --prefix .brightsec \
            @sectester/core@0.49.0 \
            @sectester/repeater@0.49.0 \
            @sectester/scan@0.49.0 \
            @sectester/runner@0.49.0 \
            @sectester/reporter@0.49.0

      - name: Authenticate with Bright
        uses: ./.github/workflows/composite/configure-bright-credentials
        with:
          BRIGHT_HOSTNAME: development.playground.brightsec.com
          BRIGHT_PROJECT_ID: tJNyGeHbdMFxoBpcEGHJzH
          BRIGHT_TOKEN: ${{ secrets.BRIGHT_TOKEN }}

      - name: Install ts-node
        run: npm install --save-dev --prefix .brightsec ts-node

      - name: Run security tests
        env:
          BRIGHT_HOSTNAME: development.playground.brightsec.com
          BRIGHT_PROJECT_ID: tJNyGeHbdMFxoBpcEGHJzH
          BRIGHT_AUTH_ID: iAGWkkjxGm8FkXgSP4s2ff
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIGHT_TOKEN: ${{ env.BRIGHT_TOKEN }}
          BRIGHT_TARGET_URL: http://127.0.0.1:3011
          SECTESTER_SCAN_POOL_SIZE: ${{ vars.SECTESTER_SCAN_POOL_SIZE }}
        run: |
          npx ts-node --transpile-only .brightsec/tests/*.test.ts
